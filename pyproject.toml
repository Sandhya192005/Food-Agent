[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query()/etc. as function-call default arguments is the
# standard, documented dependency-injection idiom, not the mutable-default-argument
# footgun this rule exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/*", "app/main.py"]
